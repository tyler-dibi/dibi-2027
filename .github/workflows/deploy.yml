# Builds every push and publishes it to Cloudflare Pages:
#   main      -> https://<project>.pages.dev              (the blank template)
#   any other -> https://<branch>.<project>.pages.dev     (updates on every push)
#
# Builds run on GitHub (up to 20 at once) rather than Cloudflare's build queue (one at a time), so many teams can
# push at the same time. Setup: docs/publishing.md.
name: Deploy

on:
  push:
    branches: ["**"]

# A newer push to the same branch replaces a build that hasn't finished yet.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the Cloudflare settings
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          missing=0
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions > Secrets)."; missing=1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret (Settings > Secrets and variables > Actions > Secrets)."; missing=1
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error::Add CLOUDFLARE_PROJECT_NAME as a repository variable, not a secret (Settings > Secrets and variables > Actions > Variables)."; missing=1
          fi
          exit $missing

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (includes the Carbon-only lint and type checks)
        run: npm run build
        env:
          CF_PAGES_BRANCH: ${{ github.ref_name }}

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          # Cloudflare sometimes rejects uploads with "Unknown internal error" when many branches publish at once.
          for attempt in 1 2 3; do
            if npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true 2>&1 | tee deploy.log; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Cloudflare rejected the upload 3 times. Re-run this job, or push again."
              exit 1
            fi
            echo "::warning::Upload attempt $attempt failed; trying again in $((attempt * 20)) seconds."
            sleep $((attempt * 20))
          done
          if [ "$BRANCH" = "main" ]; then
            url="https://$PROJECT.pages.dev"
          else
            url=$(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | tail -1)
          fi
          {
            echo "### Published \`$BRANCH\`"
            echo "Live at: $url"
          } >> "$GITHUB_STEP_SUMMARY"
